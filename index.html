<script> function openDoor(nummer,objekt) { var heute=new Date(); var tag=heute.getDate(); var monat=heute.getMonth()+1; if(monat!=12 || nummer>tag) { alert("Dieses Tuerchen darf erst am "+nummer+". Dezember geoeffnet werden."); return; } localStorage.setItem('door_'+nummer,'open'); objekt.style.borderColor='#8e44ad'; objekt.style.color='#8e44ad'; var datei=nummer.toString(); if(datei.length<2) { datei='0'+datei; } document.getElementById('coverbild').src='cover/'+datei+'.jpg'; document.querySelector('audio source').src='songs/'+datei+'.mp3'; document.querySelector('audio').load(); document.getElementById('popup').style.display='block'; } window.onload=function(){ for(var i=1;i<=24;i++){ if(localStorage.getItem('door_'+i)=='open'){ var buttons=document.getElementsByTagName('button'); for(var j=0;j<buttons.length;j++){ if(buttons[j].innerHTML==i){ buttons[j].style.borderColor='#8e44ad'; buttons[j].style.color='#8e44ad'; } } } } }; document.addEventListener('keydown',function(e){ if(e.ctrlKey&&e.altKey&&e.key==='r'){ if(confirm('Kalender wirklich zuruecksetzen?')){ localStorage.clear(); location.reload(); } } }); </script>
